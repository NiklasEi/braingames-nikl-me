[package]
name = "og"
version = "0.1.0"
edition = "2024"
description = "The link preview image of a shared puzzle"
publish = false

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
base64 = "0.23"
imagequant = { version = "4.4", default-features = false }
lambda_runtime = "1.5"
mimalloc = { version = "0.1", default-features = false, optional = true }
oicana = { version = "0.10", default-features = false, features = ["packed", "png"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
lto = "thin"
strip = true
